services:
  catalog:
    build: ./services/catalog
    environment: { PORT: 4101 }
    expose: ["4101"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4101/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
  orders:
    build: ./services/orders
    environment: { PORT: 4102, CATALOG_URL: http://catalog:4101 }
    ports: ["4102:4102"]
    depends_on:
      catalog: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4102/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
