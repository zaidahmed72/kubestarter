apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: zaid-store
spec:
  replicas: 2
  selector: { matchLabels: { app: catalog } }
  template:
    metadata: { labels: { app: catalog } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: catalog
          image: zaid-catalog:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 4101 }]
          readinessProbe: { httpGet: { path: /health/ready, port: http }, initialDelaySeconds: 3, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 250m, memory: 128Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
---
apiVersion: v1
kind: Service
metadata: { name: catalog, namespace: zaid-store }
spec:
  selector: { app: catalog }
  ports: [{ name: http, port: 4101, targetPort: http }]
